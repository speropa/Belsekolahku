<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.67">
    <title>Prototipe Bel Sekolah (Web Remote)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); }
        .main-header { background: linear-gradient(90deg, #f97316 0%, #fb923c 100%); border-radius: 0.75rem; color: white; }
        .btn { background-color: #f1f5f9; color: #475569; border-radius: 0.5rem; padding: 0.75rem 1rem; font-weight: 600; transition: all 0.2s ease-in-out; border: 1px solid #cbd5e1; }
        .btn:hover:not(:disabled) { background-color: #e2e8f0; transform: translateY(-2px); box-shadow: 0 2px 8px rgb(0 0 0 / 0.1); }
        .btn-primary { background-color: #f97316; color: white; border-color: #f97316; }
        .btn-primary:hover:not(:disabled) { background-color: #ea580c; }
        .btn:disabled { background-color: #f8fafc; color: #cbd5e1; cursor: not-allowed; opacity: 0.6; }
        .btn-day.active { background-color: #2563eb; color: white; border-color: #1d4ed8; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(30, 41, 59, 0.7); backdrop-filter: blur(4px); z-index: 40; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .modal-backdrop.visible { opacity: 1; pointer-events: auto; }
        .hidden { display: none; }
        .tab-btn.active { border-bottom: 3px solid #ea580c; color: #ea580c; font-weight: 700; }
        #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 100; display: flex; flex-direction: column; gap: 0.75rem; }
        .toast { display: flex; align-items: center; padding: 1rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); color: white; font-weight: 600; min-width: 300px; animation: toast-in 0.5s ease; }
        .toast.hiding { animation: toast-out 0.5s ease forwards; }
        .toast-success { background-color: #22c55e; } .toast-error { background-color: #ef4444; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #f97316; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .past-schedule-item { background-color: #fef9c3; border-color: #fde68a; }

        /* Gaya baris berwarna orange untuk jadwal yang terisi */
        .row-filled { background-color: #ffedd5 !important; border-left: 6px solid #f97316 !important; }
        .row-filled td { font-weight: 800; color: #9a3412; }
        .row-filled select { border: 2px solid #f97316 !important; font-weight: 900; color: #7c2d12; background-color: #fffaf5; }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">
    <div id="toast-container"></div>
    
    <div id="desktop-status-indicator" class="fixed top-4 left-4 z-50 flex items-center bg-white/80 backdrop-blur-sm p-2 pr-3 rounded-full shadow-md hidden">
        <span id="status-dot" class="w-3 h-3 rounded-full bg-yellow-400 animate-pulse"></span>
        <span id="status-text" class="ml-2 text-sm font-semibold text-slate-600">Menghubungkan...</span>
    </div>

    <div id="loading-spinner" class="fixed inset-0 flex flex-col items-center justify-center bg-slate-100 z-50">
        <div class="spinner"></div>
        <p id="loading-spinner-text" class="mt-4 text-slate-600 font-semibold">Melakukan autentikasi awal...</p>
    </div>

    <div id="login-page" class="fixed inset-0 flex items-center justify-center bg-slate-100 z-40 hidden">
        <div class="card w-full max-w-sm p-8 shadow-xl">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Selamat Datang</h2>
                <p class="text-slate-500">Silakan masuk untuk melanjutkan</p>
            </div>
            <form id="login-form">
                <div class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-600">Username</label>
                        <input type="text" id="username" class="mt-1 w-full bg-slate-50 border rounded-md p-3 focus:ring-2 focus:ring-orange-500 focus:outline-none" required>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-600">Password</label>
                        <div class="relative">
                            <input type="password" id="password" class="mt-1 w-full bg-slate-50 border rounded-md p-3 focus:ring-2 focus:ring-orange-500 focus:outline-none" required>
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden">Username atau password salah.</p>
                <button type="submit" class="w-full btn btn-primary mt-6 py-3 text-lg">Masuk</button>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="max-w-7xl mx-auto space-y-6">
            <header class="main-header p-4 grid grid-cols-1 md:grid-cols-3 gap-6 shadow-lg">
                <div class="flex items-center space-x-4">
                    <img id="school-logo" src="https://raw.githubusercontent.com/smp2pajangan/gambar/refs/heads/main/logosmpn2pjg.png" class="w-12 h-12 rounded-full bg-white/20 p-1"/>
                    <div><h1 class="text-xl font-bold">SMPN 2 PAJANGAN</h1><p class="text-sm text-orange-100">(Web Remote)</p></div>
                </div>
                <div class="text-center">
                    <div id="time" class="text-4xl font-extrabold tracking-wider">00:00:00</div>
                    <div id="date" class="text-lg text-orange-100">Memuat...</div>
                </div>
                <div class="text-center">
                    <div id="activeProgram" class="text-2xl font-bold"><span id="activeDayDisplay">-</span></div>
                    <button id="settingBtn" class="btn mt-2 px-6 py-2" disabled>Setting</button>
                </div>
            </header>
            
            <main class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div class="lg:col-span-1 space-y-6">
                    <div class="card p-4"><h3 class="font-bold border-b pb-2 mb-2">JADWAL UTAMA</h3>
                        <select id="templateSelect" class="w-full border rounded p-2 text-lg mb-4" disabled></select>
                        <div id="jadwalUtamaContainer" class="grid grid-cols-2 gap-3"></div>
                    </div>
                    <div class="card p-4"><h3 class="font-bold border-b pb-2 mb-2">JADWAL KHUSUS</h3><div id="jadwalKhususContainer" class="grid grid-cols-2 gap-3"></div></div>
                </div>
                <div class="lg:col-span-2 card p-4"><h3 class="font-bold border-b pb-2 mb-4 text-center">REMOTE MANUAL</h3><div id="manualSoundGrid" class="grid grid-cols-3 sm:grid-cols-5 gap-3"></div></div>
                <div class="lg:col-span-1 card p-4 flex flex-col"><h3 class="font-bold border-b pb-2 mb-4">HARI INI</h3><div id="activeScheduleContainer" class="space-y-2"></div></div>
            </main>
        </div>

        <div id="settingsModal" class="modal-backdrop"><div class="card w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl"><header class="p-4 border-b flex justify-between items-center bg-slate-50"><h3 class="text-xl font-bold">Pengaturan</h3><div class="flex gap-2"><button class="tab-btn p-2 active" data-tab="hari">Hari</button><button class="tab-btn p-2" data-tab="jam">Jam</button><button class="tab-btn p-2" data-tab="bel">Bel</button><button class="tab-btn p-2" data-tab="jadwal">Jadwal</button></div><button id="closeSettings" class="text-2xl font-bold">&times;</button></header><main class="p-6 overflow-y-auto bg-white flex-grow"><div id="tab-content-hari" class="tab-content"></div><div id="tab-content-jam" class="tab-content hidden"></div><div id="tab-content-bel" class="tab-content hidden"></div><div id="tab-content-jadwal" class="tab-content hidden"></div></main></div></div>
        <div id="editHariModal" class="modal-backdrop"></div><div id="deleteHariModal" class="modal-backdrop"></div><div id="editJamModal" class="modal-backdrop"></div><div id="deleteJamModal" class="modal-backdrop"></div><div id="editBelModal" class="modal-backdrop"></div>
        <div id="confirmPlayModal" class="modal-backdrop"><div class="card w-full max-w-sm p-6 text-center"><h3 class="text-xl font-bold mb-4">Konfirmasi</h3><p>Bunyikan <strong id="confirmBellName">...</strong> di sekolah?</p><div class="flex gap-4 mt-6"><button class="btn w-full" data-action="close">Batal</button><button id="confirmPlayBtn" class="btn bg-orange-600 text-white w-full">Yakin</button></div></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnR2U7iBj1R7CFbAJzVYxzASxXcAztqp8",
            authDomain: "bel-sekolah-5ab64.firebaseapp.com",
            databaseURL: "https://bel-sekolah-5ab64-default-rtdb.firebaseio.com",
            projectId: "bel-sekolah-5ab64",
            storageBucket: "bel-sekolah-5ab64.appspot.com",
            messagingSenderId: "100622592851",
            appId: "1:100622592851:web:0b23f7d00ae0a44bf94fa6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        document.addEventListener('DOMContentLoaded', function() {
            const loginPage = document.getElementById('login-page');
            const mainApp = document.getElementById('main-app');
            const loginForm = document.getElementById('login-form');
            const desktopStatusIndicator = document.getElementById('desktop-status-indicator');
            
            let masterJam = [], masterBel = [], jadwalKhusus = [], masterJadwal = {};
            let savedTemplate = 'HARI NORMAL', isDataLoaded = false, availableSounds = [];
            let manualDayOverride = null, temporaryOverride = { date: null, name: null };
            
            const templates = ['HARI NORMAL', 'BULAN PUASA', 'UJIAN', 'KOKULIKULER', 'LAINNYA'];
            const jadwalUtama = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const MODALS = { settings: 'settingsModal', editHari: 'editHariModal', deleteHari: 'deleteHariModal', editJam: 'editJamModal', deleteJam: 'deleteJamModal', editBel: 'editBelModal', confirmPlay: 'confirmPlayModal' };

            signInWithEmailAndPassword(auth, "speropa@gmail.com", "Pajangan201184*").then(() => {
                document.getElementById('loading-spinner').classList.add('hidden');
                loginPage.classList.remove('hidden');
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const snapshot = await get(ref(db, 'Login'));
                const loginData = snapshot.val();
                if (loginData.user === document.getElementById('username').value && loginData.password === document.getElementById('password').value) {
                    loginPage.classList.add('hidden');
                    mainApp.classList.remove('hidden');
                    desktopStatusIndicator.classList.remove('hidden');
                    initApp();
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            });

            function initApp() {
                onValue(ref(db, 'schoolBellConfig'), snap => {
                    const data = snap.val() || {};
                    masterJam = data.masterJam || [];
                    masterBel = data.masterBel || Array.from({ length: 30 }, (_, i) => ({ id: i + 1, nama: `Bel ${i + 1}`, file: '' }));
                    jadwalKhusus = data.jadwalKhusus || [];
                    masterJadwal = data.masterJadwal || {};
                    savedTemplate = data.savedTemplate || 'HARI NORMAL';
                    manualDayOverride = data.manualDayOverride;
                    temporaryOverride = data.temporaryOverride || { date: null, name: null };

                    if (!isDataLoaded) {
                        isDataLoaded = true;
                        document.getElementById('settingBtn').disabled = false;
                        document.getElementById('templateSelect').disabled = false;
                        setInterval(updateTime, 1000);
                        setupEvents();
                    }
                    renderAll();
                });
                onValue(ref(db, 'availableSounds'), snap => { availableSounds = snap.val() || []; });
            }

            function setupEvents() {
                document.getElementById('settingBtn').onclick = () => { renderSettings(); showModal('settings'); };
                document.getElementById('closeSettings').onclick = () => { hideModal('settings'); renderAll(); };
                document.getElementById('templateSelect').onchange = (e) => { savedTemplate = e.target.value; save(); };
                
                document.getElementById('tab-content-jadwal').addEventListener('change', e => {
                    if (e.target.tagName === 'SELECT') {
                        const t = document.getElementById('jadwalTemplateSelect').value;
                        const d = document.getElementById('jadwalDaySelect').value;
                        const j = e.target.dataset.jam;
                        const b = parseInt(e.target.value);
                        let s = (t === 'JADWAL_KHUSUS') ? jadwalKhusus.find(x => x.nama === d)?.jadwal : masterJadwal[t]?.[d];
                        if (s) { if (b === 0) delete s[j]; else s[j] = b; renderJadwalTable(); save(); }
                    }
                });
            }

            function save() {
                const data = { masterJam, masterBel, jadwalKhusus, masterJadwal, savedTemplate, manualDayOverride, temporaryOverride, lastUpdated: new Date().toISOString() };
                set(ref(db, 'schoolBellConfig'), data);
            }

            function renderAll() {
                const info = getActiveInfo();
                document.getElementById('activeDayDisplay').textContent = info.name.toUpperCase();
                
                const ts = document.getElementById('templateSelect');
                ts.innerHTML = templates.map(t => `<option value="${t}" ${t===savedTemplate?'selected':''}>${t}</option>`).join('');
                
                document.getElementById('jadwalUtamaContainer').innerHTML = jadwalUtama.map(d => 
                    `<button class="btn btn-day text-xs ${d===info.name?'active':''}" onclick="setDay('${d}')">${d}</button>`
                ).join('');

                document.getElementById('manualSoundGrid').innerHTML = masterBel.map((b, i) => 
                    `<button class="btn text-xs ${!b.file?'opacity-50 cursor-not-allowed':''}" ${!b.file?'disabled':''} data-bel-index="${i}">${b.nama}</button>`
                ).join('');
                
                renderActive();
            }

            window.setDay = (d) => {
                manualDayOverride = (manualDayOverride?.dayName === d) ? null : { date: new Date().toISOString().split('T')[0], dayName: d };
                temporaryOverride = { date: null, name: null };
                save();
            };

            function getActiveInfo() {
                const today = new Date().toISOString().split('T')[0];
                const dayName = new Date().toLocaleDateString('id-ID', { weekday: 'long' });
                if (temporaryOverride.date === today && temporaryOverride.name) {
                    return { schedule: jadwalKhusus.find(j => j.nama === temporaryOverride.name)?.jadwal || {}, name: temporaryOverride.name };
                }
                const active = manualDayOverride?.dayName || dayName;
                return { schedule: (masterJadwal[savedTemplate] || {})[active] || {}, name: active };
            }

            function renderJadwalTable() {
                const b = document.querySelector('#jadwalTable tbody');
                const t = document.getElementById('jadwalTemplateSelect').value;
                const d = document.getElementById('jadwalDaySelect').value;
                b.innerHTML = '';
                let s = (t === 'JADWAL_KHUSUS') ? (jadwalKhusus.find(x=>x.nama===d)?.jadwal || {}) : (masterJadwal[t]?.[d] || {});
                
                [...masterJam].sort().forEach(j => {
                    const belId = s[j] || 0;
                    const isFilled = belId > 0;
                    const row = document.createElement('tr');
                    row.className = 'border-b ' + (isFilled ? 'row-filled' : '');
                    row.innerHTML = `<td class="p-3">${j}</td><td class="p-3"><select class="w-full border p-2 rounded" data-jam="${j}"><option value="0">(Kosong)</option>${masterBel.filter(l=>l.file||l.nama).map(l=>`<option value="${l.id}" ${l.id==belId?'selected':''}>${l.nama}</option>`).join('')}</select></td>`;
                    b.appendChild(row);
                });
            }

            function renderSettings() {
                document.getElementById('tab-content-jadwal').innerHTML = `<div class="flex gap-4 mb-4"><select id="jadwalTemplateSelect" class="border p-2 rounded w-1/2"></select><select id="jadwalDaySelect" class="border p-2 rounded w-1/2"></select></div><table id="jadwalTable" class="w-full"><thead><tr class="border-b text-left"><th>Jam</th><th>Bel</th></tr></thead><tbody></tbody></table>`;
                const t = document.getElementById('jadwalTemplateSelect');
                const d = document.getElementById('jadwalDaySelect');
                t.innerHTML = templates.map(v => `<option value="${v}">${v}</option>`).concat('<option value="JADWAL_KHUSUS">JADWAL KHUSUS</option>').join('');
                const upd = () => {
                    d.innerHTML = (t.value === 'JADWAL_KHUSUS' ? jadwalKhusus.map(j => j.nama) : jadwalUtama).map(v => `<option value="${v}">${v}</option>`).join('');
                    renderJadwalTable();
                };
                t.onchange = upd; d.onchange = renderJadwalTable; upd();
            }

            function updateTime() {
                const now = new Date();
                document.getElementById('time').textContent = now.toLocaleTimeString('id-ID');
                document.getElementById('date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }

            function renderActive() {
                const { schedule } = getActiveInfo();
                const nowStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
                document.getElementById('activeScheduleContainer').innerHTML = Object.keys(schedule).sort().map(jam => {
                    const bel = masterBel.find(b => b.id == schedule[jam]);
                    return `<div class="p-2 border rounded flex justify-between ${jam<=nowStr?'past-schedule-item':'bg-white'}"><span class="font-bold">${jam}</span><span class="text-orange-600 font-bold">${bel?.nama || '-'}</span></div>`;
                }).join('');
            }

            function showModal(k) { document.getElementById(MODALS[k]).classList.add('visible'); }
            function hideModal(k) { document.getElementById(MODALS[k]).classList.remove('visible'); }
        });
    </script>
</body>
</html>
